    <style>
        body {
            background-color: #f8f9fa;
        }

        /* หัวข้อ */
        .title {
            margin-top: 40px;
            margin-bottom: 35px;
            font-weight: bold;
            color: #333;
        }

        /* การ์ดสินค้า */
        .product-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            background-color: white;
            transition: all 0.3s ease;
        }

        /* เอฟเฟกต์ตอนเอาเมาส์วาง */
        .product-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15) !important;
        }

        /* รูปสินค้า */
        .same-img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            padding: 15px;
            background-color: #fff;
        }

        /* ชื่อสินค้า */
        .product-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        /* ราคา */
        .product-price {
            color: #777;
            margin-top: 8px;
        }

        /* ปุ่มเพิ่มลงตะกร้า */
        .add-btn {
            background-color: #212529;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 8px 22px;
            transition: 0.3s;
        }

        .add-btn:hover {
            background-color: #495057;
            color: white;
        }

        .add-btn i {
            margin-right: 5px;
        }
    </style>

</head>
