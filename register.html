<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reagister</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!----Menu---->
<div id="menu-container"></div>

<div class="container  ">
<form id="form1">
    <div class="row  ">
        <div class="col-md-6 mx-auto mt-5 bg-light   rounded">
            <div class="h3 text-center text-primary mt-3 ">Register</div>
            <div class="mb-3 mt-4 ">
                <label class="form-label">Firstname - Lastname</label>
                <input type="text" class="form-control" id="firstname-lastname" placeholder="firstname - lastname" readonly>
            </div>
            <div class="mb-3 mt-4 ">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Houes No.</label>
                <textarea class="form-control" id="textDetail" rows="3" readonly></textarea>
            </div>
            <div class="mb-3 mt-4 ">
                <label class="form-label">User</label>
                <input type="text" class="form-control" id="User" placeholder="User" readonly>
            </div>
            <div class="mb-3 mt-4 ">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="Password" placeholder="Password" readonly>
            </div>
            <div class="text-center mb-4">
                <input type="submit" id="submit" class="btn btn-primary" value="Submit">
                <input type="reset" id="reset" class="btn btn-danger" value="cancel">
            </div>
        </div>
    </div>
</form>
</div>

    
</body>
</html>
<script src="js/bootstrap.bundle.min.js" ></script>
<script src="js/menu.js"></script>
